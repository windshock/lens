name: Update Popular Domains

on:
  schedule:
    # Tranco publishes the daily list by 00:00 UTC. Run after that window.
    - cron: "37 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: 'Final number of domains to keep. Use "unlimited" to keep all merged domains.'
        required: false
        default: "2000"
      source_limit:
        description: 'Rows to read from each source. Use "unlimited" to read full source files.'
        required: false
        default: "10000"
      tranco_size:
        description: "Tranco download size"
        required: false
        type: choice
        options:
          - "1000000"
          - "full"
        default: "1000000"

permissions:
  contents: write

concurrency:
  group: update-popular-domains
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      POPULAR_DOMAIN_LIMIT: ${{ github.event.inputs.limit || '2000' }}
      POPULAR_DOMAIN_SOURCE_LIMIT: ${{ github.event.inputs.source_limit || '10000' }}
      TRANCO_LIST_SIZE: ${{ github.event.inputs.tranco_size || '1000000' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Update generated domain list
        run: node tools/update-popular-domains.mjs

      # PR 없이 popular-domains.js 만 main 에 직접 커밋(생성 데이터 파일이라 리뷰 불요).
      - name: Commit updated domain list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- popular-domains.js; then
            echo "popular-domains.js unchanged — nothing to commit."
          else
            git add popular-domains.js
            git commit -m "chore: update popular domains [skip ci]"
            git push
            echo "popular-domains.js updated and pushed."
          fi
